<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVINGROOM507MOC | Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="portal-loading">
    <nav class="mag-nav">
        <div class="nav-container">
            <a href="index.html">MAGAZINE HOME</a>
            <a href="#">CSV SYNC</a>
            <span class="nav-session" id="session-username">Signed in</span>
            <a href="/api/logout" id="logout-link">LOGOUT</a>
        </div>
    </nav>

    <section class="portal-container">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <h2 class="numbered-header" style="flex: 1;">08. Operational Dashboard</h2>
                <button onclick="printDashboard()" class="btn-sync" style="width: auto; margin-bottom: 10px; padding: 10px 20px;">Print Weekly Review</button>
            </div>

            <div class="dashboard-stats">
                <div class="stat-box">
                    <span>Total Engagement</span>
                    <h3 id="stat-total-clicks">14,205</h3>
                </div>
                <div class="stat-box">
                    <span>Avg. Conversion</span>
                    <h3>4.8%</h3>
                </div>
                <div class="stat-box">
                    <span>Active Region</span>
                    <h3>Ireland</h3>
                </div>
                <div class="stat-box">
                    <span>Report Dispatches</span>
                    <h3>892</h3>
                </div>
            </div>

            <div class="blaster-row">
                <div class="chart-wrapper chart-wrapper-wide" style="flex: 2;">
                    <h4>Regional Engagement (Clicks)</h4>
                    <canvas id="regionalChart"></canvas>
                </div>
                <div class="chart-wrapper chart-wrapper-compact" style="flex: 1;">
                    <h4>Interest Split: Practical vs Managerial</h4>
                    <canvas id="contentChart"></canvas>
                </div>
            </div>

            <div class="chart-wrapper chart-wrapper-trend">
                <h4>Lead Generation Trend (2-Week Outlook)</h4>
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </section>

    <script src="portal-static.js"></script>
</body>
</html>
