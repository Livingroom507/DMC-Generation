<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Login | Livingroom507MOC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="calculator-wrapper">
            <h2 class="numbered-header" style="margin-top: 0;">07. Portal Access</h2>
            <p>Enter credentials to access managerial functions.</p>
            <p id="login-message" class="alert-danger" hidden></p>

            <form id="login-form">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" class="input-field" autocomplete="username" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password" class="input-field" autocomplete="current-password" required>

                <button type="submit" class="btn-sync" id="login-submit">Secure Login</button>
            </form>

            <p class="login-links">
                <a href="index.html">Return to magazine home</a>
            </p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
